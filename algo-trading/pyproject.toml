[project]
name = "algomvp"
version = "0.1.0"
description = "An end-to-end algorithmic trading research and paper-trading system."
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
]

[project.scripts]
algomvp = "algomvp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- Formatting and linting -------------------------------------------------
# Black is the formatter (it rewrites code). Ruff is the linter (it complains
# about code). Both are pinned to an 88 character line so they never disagree.

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W = pycodestyle (PEP 8), F = pyflakes (real bugs), I = import ordering,
# N = PEP 8 naming, D = docstring presence, UP = modern-Python idioms.
select = ["E", "W", "F", "I", "N", "D", "UP"]
ignore = [
    "D203",  # conflicts with D211; we keep D211 (no blank line before class)
    "D213",  # conflicts with D212; we keep D212 (summary on first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # docstrings are not required on test functions

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
